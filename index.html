<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F1020" />
    <meta name="description" content="주머니 속 타로 리더 — 카드를 뽑아 오늘의 조언을 만나보세요." />
    <!-- 홈 화면에 추가(웹앱) — 이름·아이콘·매니페스트는 슬롯마다 SlotProvider 가 심는다 (src/slot/pwa.ts) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // 테마 깜빡임 방지 — 첫 페인트 전에 이 슬롯의 배경색을 깐다.
      // SlotProvider 가 지난 방문 때 슬러그별로 캐시해 둔 값을 읽는다 (없으면 기본 다크 그대로).
      // 카페에서 홈 화면에 추가한 웹앱을 다시 열 때 어두운색이 번쩍이지 않게 하는 게 목적이다.
      (function () {
        try {
          var slug = location.pathname.split('/').filter(Boolean)[0]
          if (!slug) return
          var raw = localStorage.getItem('tarot-pocket:theme:' + slug)
          if (!raw) return
          var t = JSON.parse(raw)
          if (!t || !t.canvas) return
          var root = document.documentElement
          root.style.setProperty('--color-canvas', t.canvas)
          root.setAttribute('data-theme', t.light ? 'light' : 'dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t.canvas)
        } catch (e) {}
      })()
    </script>
    <!--
      슬롯 밖(배포 루트·편집기)에서만 보이는 제목이다. 슬롯에 들어가면 행사명으로 바뀐다
      (SlotProvider) — 방문자가 홈 화면에 추가하면 그 이름이 앱 이름이 된다.
      '타로 포켓' 이었는데 타로는 이 플랫폼이 파는 여러 서비스 중 하나일 뿐이라 바꿨다.
    -->
    <title>서비스 빌더</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
