project_id = "tarot-pocket"

[functions.ai]
# JWT 검증을 Supabase 에 맡기지 않는다 — **경로마다 필요한 권한이 다르기 때문이다.**
#   /status  누구나 (화면이 AI 를 띄울지 정하는 값이라 로그인 전에도 답해야 한다)
#   /reading 방문자 (로그인하지 않는다 — 익명 토큰이 있으면 그걸로 레이트리밋을 센다)
#   /answers 그 슬롯 주최자만
#   /theme   최고관리자만
# 전역으로 켜면 /status 가 401 이 되고, 앱은 "AI 없음" 으로 조용히 접힌다.
verify_jwt = false

[functions.admin]
# 여기도 Supabase 에 맡기지 않는다 — **필요한 건 "로그인했나" 가 아니라 "최고관리자인가" 다.**
# verify_jwt 는 토큰이 유효한지만 본다. 주최자 토큰도, 방문자의 익명 토큰도 통과시킨다.
# 진짜 검사는 함수 안의 is_owner() 이고, 그게 있으면 이건 이중이 아니라 그냥 다른 문이다.
#
# 게다가 켜면 게이트웨이가 **CORS 헤더 없이** 401 을 주므로 브라우저엔 CORS 오류로 보인다 —
# 권한이 없다는 사실이 "왜 안 되지" 로 바뀐다.
verify_jwt = false
